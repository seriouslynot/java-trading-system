server.port=8080
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
management.endpoints.web.exposure.include=health
trading.symbol=DEMO
trading.journal-path=data/journal.log
trading.journal-fsync=GROUP
trading.group-commit-max-batch=256
trading.queue-capacity=2000
trading.request-timeout-ms=2000
trading.rate-limit-burst=500
trading.rate-limit-per-second=1000
trading.admin-token=
trading.seed-demo-accounts=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
management.endpoint.health.probes.enabled=false
